name: Framework migration probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Clone pinned legacy library
        shell: pwsh
        run: |
          git clone --depth 1 --branch 6.0.8 https://github.com/JamesNK/Newtonsoft.Json.git legacy/Newtonsoft.Json
          git -C legacy/Newtonsoft.Json rev-parse HEAD | Out-File source-commit.txt
      - name: Build original Framework library
        shell: pwsh
        run: |
          dotnet build legacy/Newtonsoft.Json/Src/Newtonsoft.Json/Newtonsoft.Json.csproj -c Release *> baseline.log
          "Baseline build exit code: $LASTEXITCODE" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Convert project and run first build
        shell: pwsh
        run: |
          Copy-Item legacy/Newtonsoft.Json/Src/Newtonsoft.Json migrated -Recurse
          $project = 'migrated/Newtonsoft.Json.csproj'
          Move-Item $project "$project.original"
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <AssemblyName>Newtonsoft.Json</AssemblyName>
              <RootNamespace>Newtonsoft.Json</RootNamespace>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <DefineConstants>TRACE;CODE_ANALYSIS</DefineConstants>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>
          </Project>
          '@ | Set-Content $project
          dotnet build $project -c Release *> migration-1.log
          "First migration build exit code: $LASTEXITCODE" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Repair Reflection.Emit dependencies and rebuild
        shell: pwsh
        run: |
          $project = 'migrated/Newtonsoft.Json.csproj'
          $xml = Get-Content $project -Raw
          $xml = $xml.Replace('</Project>', @'
            <ItemGroup>
              <PackageReference Include="System.Reflection.Emit.ILGeneration" Version="4.7.0" />
              <PackageReference Include="System.Reflection.Emit.Lightweight" Version="4.7.0" />
              <PackageReference Include="System.Security.Permissions" Version="4.7.0" />
            </ItemGroup>
          </Project>
          '@)
          Set-Content $project $xml
          dotnet build $project -c Release *> migration-2.log
          $code = $LASTEXITCODE
          "Second migration build exit code: $code" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content migration-2.log -Tail 50 | Add-Content $env:GITHUB_STEP_SUMMARY
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-probe-logs
          path: |
            *.log
            source-commit.txt
            migrated/Newtonsoft.Json.csproj
            migrated/Newtonsoft.Json.csproj.original
